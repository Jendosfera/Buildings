name: Build Android APK (Kotlovan CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Кэширование SDK/NDK (экономит 15–20 минут на каждом следующем запуске)
      - name: Cache Android SDK and NDK
        uses: actions/cache@v3
        with:
          path: |
            /home/runner/.buildozer/android/platform/android-ndk-r*
            /home/runner/.buildozer/android/platform/android-sdk
          key: android-cache-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: |
            android-cache-${{ runner.os }}-

      # 2. Checkout
      - name: Checkout repo
        uses: actions/checkout@v4

      # 3. Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

             # 4. Подготовка Android SDK (cmdline-tools + лицензии)
      - name: Prepare Android SDK and accept licenses
        run: |
          # Создаём структуру папок
          mkdir -p "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          # Скачиваем cmdline-tools (минимальная версия, где есть sdkmanager)
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          curl -Lo cmdline-tools.zip "$CMDLINE_TOOLS_URL"
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"

          # Google кладёт содержимое в папку "cmdline-tools/cmdline-tools".
          # Для sdkmanager важно, чтобы путь был $ANDROID_HOME/cmdline-tools/latest
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

          # Добавляем sdkmanager в PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

          # Проверяем, что sdkmanager виден
          sdkmanager --version

          # Принимаем все лицензии (это обязательно, иначе сборка упадёт на лицензиях)
          yes | sdkmanager --licenses > /dev/null || true
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk

      # 5. Установка компонентов SDK (нужные Buildozer пакеты)
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" > /dev/null
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk

       # 4. JDK 17 (обязательно для Android)
      - name: Set up JDK (Java 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java
        run: |
          which javac
          javac -version

      # 5. Установка Buildozer и зависимостей
      - name: Install Buildozer and dependencies
        run: pip install buildozer cython

      # 6. Установка cmdline-tools и принятие лицензий (это исправляет ошибку sdkmanager not found)
      - name: Setup Android SDK cmdline-tools and accept licenses
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          # Создаём папку SDK
          mkdir -p "$ANDROID_HOME"

          # Скачиваем cmdline-tools (минимальная версия, нужная sdkmanager)
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
