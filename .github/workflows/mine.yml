name: Build Android APK (Kotlovan)

on:
  push:
    ###branches:
    ###  - main
  pull_request:
    ###branches:
    ###  - main
  workflow_dispatch:  # позволяет запускатручную кнопкой в Actionsь сборку в

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK (Java 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java installation
        run: |
          which javac
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install Buildozer and dependencies
        run: pip install buildozer cython

      - name: Build APK
        run: python -m buildozer -v android debug
