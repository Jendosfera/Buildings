jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK (Java 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          # cache: 'gradle' — можно оставить, можно убрать

      # (опционально) проверка, что Java видна
      - name: Verify Java installation
        run: |
          which javac
          javac -version

      - name: Install Buildozer and dependencies
        run: pip install buildozer cython

      - name: Build APK
        run: python -m buildozer -v android debug
        # Важно: buildozer ищет buildozer.spec в корне репозитория
