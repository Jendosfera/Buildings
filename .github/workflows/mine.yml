name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip autoconf automake build-essential libssl-dev libffi-dev \
            libncurses5-dev libncursesw5-dev zlib1g-dev openjdk-11-jdk unzip git
          pip install --upgrade pip
          pip install cython buildozer
          
      - name: Check sdkmanager and licenses
  run: |
    echo "ANDROID_HOME=$ANDROID_HOME"
    ls -la "$ANDROID_HOME"/licenses 2>/dev/null || echo "licenses folder not found"
    "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --version 2>&1 || \
    "$ANDROID_HOME"/cmdline-tools/bin/sdkmanager --version 2>&1 || \
    echo "sdkmanager not found in expected places"
           # Принятие лицензий Android SDK — ВАЖНО
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          # Buildozer требует, чтобы spec-файл был в корне
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk